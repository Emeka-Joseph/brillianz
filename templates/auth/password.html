{% extends "admin/base.html" %}
{% block title %}Change password{% endblock %}
{% block heading %}Change password{% endblock %}
{% block content %}
<form class="card" method="post" style="max-width:480px;display:grid;gap:14px">
  {{ csrf_field() }}
  <div><label>Current password</label><input type="password" name="current" required></div>
  <div><label>New password (min. 8 characters)</label><input type="password" name="new" minlength="8" required></div>
  <div><label>Confirm new password</label><input type="password" name="confirm" minlength="8" required></div>
  <div><button class="btn btn-primary">Update password</button></div>
</form>
{% endblock %}
